            const openPRs = await github.paginate(github.rest.pulls.list, {owner,repo,state:'open',per_page:100});
            const blocked = new Set(openPRs.flatMap(p=>[p.head.ref,p.base.ref]));
            const eligible = []; const skipped = [];
            for (const c of candidates) {
              if (!c.branch.startsWith('agent/') || blocked.has(c.branch)) { skipped.push(c.branch + ': protected by prefix/PR'); continue; }
              let current;
              try { current = (await github.rest.repos.getBranch({owner,repo,branch:c.branch})).data; }
              catch (e) { skipped.push(c.branch + ': unavailable ('+e.status+')'); continue; }
              if (current.protected || current.commit.sha !== c.sha) { skipped.push(c.branch + ': changed/protected'); continue; }
              if (c.pr !== null) {
                const pr = (await github.rest.pulls.get({owner,repo,pull_number:c.pr})).data;
                if (!pr.merged_at || pr.base.ref !== 'main' || pr.head.ref !== c.branch || pr.head.sha !== c.sha) { skipped.push(c.branch + ': PR status changed'); continue; }
              } else {
                const comparison = (await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:'main...'+c.branch})).data;
                if (comparison.ahead_by !== 0) { skipped.push(c.branch + ': has unique commits'); continue; }
              }
              eligible.push(c);
            }
            core.info('Preflight: '+eligible.length+' eligible, '+skipped.length+' skipped; '+candidates.length+' total.');
            for (const s of skipped) core.warning('SKIP '+s);
            let deleted = 0;
            for (const c of eligible) {
              const current = (await github.rest.repos.getBranch({owner,repo,branch:c.branch})).data;
              if (current.protected || current.commit.sha !== c.sha) { core.warning('Changed before delete: '+c.branch); continue; }
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+c.branch});
              deleted++; core.info('Deleted '+c.branch);
            }
            await core.summary.addHeading('Merged translation branch cleanup').addRaw('Deleted '+deleted+' of '+candidates.length+' candidates; skipped '+skipped.length).write();
            core.info('Completed deletions: '+deleted+'. Candidate total: '+candidates.length);
